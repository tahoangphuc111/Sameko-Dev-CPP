name: SamekoMac CI

on:
  push:
    paths:
      - 'macos-swiftui/**'
      - '.github/workflows/sameko-mac.yml'
  pull_request:
    paths:
      - 'macos-swiftui/**'
      - '.github/workflows/sameko-mac.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SwiftUI macOS app
    runs-on: macos-26
    defaults:
      run:
        working-directory: macos-swiftui

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build -c release

      # The package produces a raw executable for now. Once an Xcode app target
      # and signing secrets are added, replace this with a signed .app archive.
      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: SamekoMac-unsigned
          path: macos-swiftui/.build/release/SamekoMac
          if-no-files-found: error
