name: SamekoMac CI

on:
  push:
    paths:
      - 'macos-swiftui/**'
      - '.github/workflows/sameko-mac.yml'
  pull_request:
    paths:
      - 'macos-swiftui/**'
      - '.github/workflows/sameko-mac.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SwiftUI macOS app
    runs-on: macos-26
    defaults:
      run:
        working-directory: macos-swiftui

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build -c release

      - name: Create unsigned app bundle
        run: ./scripts/create-app-bundle.sh

      # Download and open this `.app`, not the raw SwiftPM executable. It
      # includes the icon, wallpaper assets, Info.plist and resource bundle.
      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: SamekoMac-unsigned-app
          path: macos-swiftui/.build/release/Sameko IDE.app
          if-no-files-found: error
