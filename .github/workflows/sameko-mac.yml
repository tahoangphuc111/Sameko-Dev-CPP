name: SamekoMac CI

on:
  push:
    paths:
      - 'macos-swiftui/**'
      - '.github/workflows/sameko-mac.yml'
  pull_request:
    paths:
      - 'macos-swiftui/**'
      - '.github/workflows/sameko-mac.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SwiftUI macOS app
    runs-on: macos-26
    defaults:
      run:
        working-directory: macos-swiftui

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build -c release

      - name: Create unsigned app bundle
        run: ./scripts/create-app-bundle.sh

      # Keep the `.app` directory itself inside the GitHub artifact. Uploading
      # the app path directly archives only `Contents/`, which Finder cannot
      # recognise or launch as an application.
      - name: Stage app artifact
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R ".build/release/Sameko IDE.app" dist/

      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: SamekoMac-unsigned-app
          path: macos-swiftui/dist
          if-no-files-found: error
